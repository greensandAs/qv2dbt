script: sales_pipeline.qvs
sources:
- table: products
  kind: qvd
  locator: lib://DataFiles/qvd/products.qvd
  consumed_by:
  - Products
- table: sales_2026
  kind: file
  locator: lib://DataFiles/csv/sales_2026.csv
  consumed_by:
  - SalesRaw
- table: sales_2025
  kind: qvd
  locator: lib://DataFiles/qvd/sales_2025.qvd
  consumed_by:
  - SalesPY
targets:
- table: Products
  layer: staging
  load_kind: qvd
  upstream: lib://DataFiles/qvd/products.qvd
  columns:
  - name: ProductID
    mapping_type: direct
    sources:
    - table: products
      column: ProductID
    business_logic_qlikview: ProductID
    snowflake_sql: ProductID
    review_notes: []
  - name: ProductName
    mapping_type: direct
    sources:
    - table: products
      column: ProductName
    business_logic_qlikview: ProductName
    snowflake_sql: ProductName
    review_notes: []
  - name: TherapeuticArea
    mapping_type: direct
    sources:
    - table: products
      column: Therapeutic Area
    business_logic_qlikview: '[Therapeutic Area]'
    snowflake_sql: '"Therapeutic Area"'
    review_notes: []
  - name: UnitPrice
    mapping_type: derived
    sources:
    - table: products
      column: UnitPrice
    business_logic_qlikview: Num(UnitPrice)
    snowflake_sql: TO_NUMBER(UnitPrice)
    review_notes: []
  - name: IsDiscontinued
    mapping_type: derived
    sources:
    - table: products
      column: Discontinued
    business_logic_qlikview: if(Discontinued = 1, 'Y', 'N')
    snowflake_sql: CASE WHEN Discontinued = 1 THEN 'Y' ELSE 'N' END
    review_notes: []
- table: SalesRaw
  layer: intermediate
  load_kind: file
  upstream: lib://DataFiles/csv/sales_2026.csv
  columns:
  - name: OrderID
    mapping_type: direct
    sources:
    - table: sales_2026
      column: OrderID
    business_logic_qlikview: OrderID
    snowflake_sql: OrderID
    review_notes: []
  - name: ProductID
    mapping_type: direct
    sources:
    - table: sales_2026
      column: ProductID
    business_logic_qlikview: ProductID
    snowflake_sql: ProductID
    review_notes: []
  - name: CustomerID
    mapping_type: direct
    sources:
    - table: sales_2026
      column: CustomerID
    business_logic_qlikview: CustomerID
    snowflake_sql: CustomerID
    review_notes: []
  - name: CountryCode
    mapping_type: direct
    sources:
    - table: sales_2026
      column: CountryCode
    business_logic_qlikview: CountryCode
    snowflake_sql: CountryCode
    review_notes: []
  - name: OrderDate
    mapping_type: derived
    sources:
    - table: sales_2026
      column: OrderDate
    business_logic_qlikview: Date(OrderDate, 'YYYY-MM-DD')
    snowflake_sql: TO_DATE(OrderDate, 'YYYY-MM-DD')
    review_notes: []
  - name: Quantity
    mapping_type: derived
    sources:
    - table: sales_2026
      column: Quantity
    business_logic_qlikview: Num(Quantity)
    snowflake_sql: TO_NUMBER(Quantity)
    review_notes: []
  - name: GrossAmount
    mapping_type: derived
    sources:
    - table: sales_2026
      column: UnitPrice
    - table: sales_2026
      column: Quantity
    business_logic_qlikview: Num(UnitPrice) * Num(Quantity)
    snowflake_sql: TO_NUMBER(UnitPrice) * TO_NUMBER(Quantity)
    review_notes: []
  - name: Country
    mapping_type: lookup
    sources:
    - table: sales_2026
      column: CountryCode
    business_logic_qlikview: ApplyMap('CountryMap', CountryCode, 'Unknown')
    snowflake_sql: '{{ apply_map(''CountryMap'', "CountryCode", "''Unknown''") }}'
    review_notes:
    - ApplyMap('CountryMap', ...) converted to apply_map() macro - confirm mapping table was generated.
  - name: OrderPrefix
    mapping_type: derived
    sources:
    - table: sales_2026
      column: OrderID
    business_logic_qlikview: Left(OrderID, 4)
    snowflake_sql: LEFT(OrderID, 4)
    review_notes: []
